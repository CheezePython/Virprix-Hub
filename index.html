<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virprix Hub | 黒</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 20%, #252525 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #171717 0%, transparent 45%);
    z-index: -2;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

/* Main card */
.card {
    width: min(90%, 420px);
    padding: 35px 25px;
    text-align: center;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.045);
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 85px;
    height: 85px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #777;
    border-radius: 50%;
    font-size: 38px;
    font-weight: bold;
    background: linear-gradient(135deg, #292929, #050505);
    box-shadow: 0 0 25px #ffffff13;
}

h1 {
    font-size: 29px;
    letter-spacing: 4px;
    margin-bottom: 10px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.label {
    text-align: left;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

/* Copy field */
.copy-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px;
    background: #101010;
    border: 1px solid #303030;
    border-radius: 12px;
}

.link-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #ddd;
    font-size: 12px;
    padding-left: 7px;
    user-select: all;
}

button {
    border: none;
    cursor: pointer;
    transition: 0.25s;
}

.copy-btn {
    padding: 12px 15px;
    border-radius: 8px;
    background: #fff;
    color: #000;
    font-weight: bold;
    font-size: 12px;
}

.copy-btn:hover {
    background: #ccc;
    transform: scale(1.04);
}

.copy-btn:active {
    transform: scale(0.95);
}

.status {
    height: 18px;
    margin-top: 12px;
    color: #aaa;
    font-size: 12px;
}

.divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #444, transparent);
    margin: 25px 0;
}

.footer {
    color: #666;
    font-size: 11px;
    letter-spacing: 2px;
}

.jp {
    color: #ddd;
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 5px;
}

@media (max-width: 400px) {
    .card {
        padding: 28px 17px;
    }

    h1 {
        font-size: 24px;
    }

    .copy-btn {
        padding: 12px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<main class="card">

    <div class="logo">V</div>

    <h1>VIRPRIX HUB</h1>

    <p class="subtitle">THE SHADOWS NEVER LIE</p>

    <p class="label">PROJECT LINK</p>

    <div class="copy-box">
        <span class="link-text" id="projectLink">
            https://cheezepython.github.io/Virprix-Hub/
        </span>

        <button class="copy-btn" id="copyButton">
            COPY
        </button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="divider"></div>

    <p class="footer">DESIGNED IN DARKNESS</p>

    <p class="jp">黒 · 白 · 無限</p>

</main>

<script>
const link =
    "https://cheezepython.github.io/Virprix-Hub/";

const copyButton = document.getElementById("copyButton");
const status = document.getElementById("status");

copyButton.addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(link);
        copyButton.textContent = "COPIED ✓";
        status.textContent = "Link copied successfully.";

        setTimeout(() => {
            copyButton.textContent = "COPY";
            status.textContent = "";
        }, 2000);
    } catch (error) {
        const input = document.createElement("textarea");
        input.value = link;
        input.style.position = "fixed";
        input.style.opacity = "0";

        document.body.appendChild(input);
        input.select();

        const success = document.execCommand("copy");
        input.remove();

        status.textContent = success
            ? "Link copied successfully."
            : "Please select and copy the link manually.";
    }
});

/* Subtle monochrome particles */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let dots = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    dots = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.4,
        speed: Math.random() * 0.35 + 0.1
    }));
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const dot of dots) {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.fill();

        dot.y -= dot.speed;

        if (dot.y < -5) {
            dot.y = canvas.height + 5;
            dot.x = Math.random() * canvas.width;
        }
    }

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();
</script>

</html>
